
<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories | Muthin Pukal</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            padding-bottom: 85px;
        }

        /* INTRO */

        .mp-category-intro {
            text-align: center;
            padding: 45px 20px 25px;
        }

        .mp-category-intro h1 {
            color: #d4af37;
            font-size: clamp(28px, 5vw, 42px);
        }

        .mp-category-intro p {
            color: #aaa;
        }

        .mp-category-section,
        .mp-category-songs {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .mp-category-section h2,
        .mp-category-songs h2 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 25px;
        }

        /* CATEGORY GRID */

        #all-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
        }

        #all-categories .category-card {
            min-height: 110px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        #all-categories .category-card:hover {
            transform: translateY(-5px);
        }

        /* SEARCH */

        #search {
            display: block;
            width: min(100%, 550px);
            margin: 25px auto;
            padding: 14px 18px;
            border: 1px solid #d4af37;
            border-radius: 30px;
            outline: none;
            box-sizing: border-box;
        }

        #song-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
            margin-top: 25px;
        }

        #song-list .song-card {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .mp-category-songs {
            display: none;
        }

        /* BOTTOM NAVIGATION */

        .mp-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #071c15;
            border-top: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
            box-sizing: border-box;
            padding: 5px 8px;
        }

        .mp-bottom-nav a {
            flex: 1;
            text-decoration: none;
            color: #a9b5ad;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 11px;
            transition: 0.3s;
        }

        .mp-bottom-nav a i {
            font-size: 20px;
        }

        .mp-bottom-nav a.active {
            color: #d4af37;
        }

        .mp-bottom-nav a.active i {
            transform: translateY(-2px);
        }

        .mp-bottom-nav a:hover {
            color: #e7c75a;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            #all-categories {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            #song-list {
                grid-template-columns: 1fr;
            }

            .mp-category-intro {
                padding-top: 30px;
            }

            .mp-bottom-nav {
                height: 65px;
            }

            .mp-bottom-nav a {
                font-size: 10px;
            }

            .mp-bottom-nav a i {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->

<header>
    <div class="logo">✦ മുത്തിൻ പുകൾ ✦</div>
    <p>ഇസ്‌ലാമിക മദ്ഹ് ഗാനങ്ങൾ</p>
</header>


<!-- CATEGORY INTRO -->

<section class="mp-category-intro">
    <h1>Explore Categories</h1>
    <p>Find your favourite collection of Islamic Madh Songs</p>
</section>


<!-- CATEGORY CARDS -->

<section class="mp-category-section">

    <h2>Our Collections</h2>

    <div class="categories" id="all-categories">

        <button type="button" onclick="filterCategory('all')" class="category-card all-card">
            <span class="category-icon">✦</span>
            <span>All Songs</span>
        </button>

        <button type="button" onclick="filterCategory('malayalam')" class="category-card malayalam-card">
            <span class="category-icon">മ</span>
            <span>Malayalam Songs</span>
        </button>

        <button type="button" onclick="filterCategory('kannada')" class="category-card kannada-card">
            <span class="category-icon">ಕ</span>
            <span>Kannada Songs</span>
        </button>

        <button type="button" onclick="filterCategory('urdu')" class="category-card urdu-card">
            <span class="category-icon">ن</span>
            <span>Urdu Na'ath</span>
        </button>

        <button type="button" onclick="filterCategory('mappila')" class="category-card mappila-card">
            <span class="category-icon">♫</span>
            <span>Mappila Songs</span>
        </button>

        <button type="button" onclick="filterCategory('ap-usthad')" class="category-card usthad-card">
            <span class="category-icon">✧</span>
            <span>A.P Usthad Songs</span>
        </button>

        <button type="button" onclick="filterCategory('sufi')" class="category-card sufi-card">
            <span class="category-icon">☪</span>
            <span>Sufi Songs</span>
        </button>

        <button type="button" onclick="filterCategory('arabic')" class="category-card arabic-card">
            <span class="category-icon">يا</span>
            <span>Arabic Nasheeds</span>
        </button>

        <button type="button" onclick="filterCategory('others')" class="category-card others-card">
            <span class="category-icon">❖</span>
            <span>Others</span>
        </button>

        <div id="dynamic-categories" style="display: contents;"></div>

    </div>

</section>


<!-- SELECTED CATEGORY SONGS -->

<section class="mp-category-songs songs" id="songs">

    <h2 id="category-heading">Our Song Collection</h2>

    <input
        type="text"
        id="search"
        placeholder="Search your favourite song..."
        oninput="searchSongs()"
    >

    <div id="song-list"></div>

</section>


<!-- FOOTER -->

<footer>
    <p>© 2026 Muthin Pukal. All Rights Reserved.</p>
    <p> Created By : Ibn Jamaluddin Al Furqani</p>
</footer>


<!-- YOUTUBE STYLE BOTTOM NAVIGATION -->

<nav class="mp-bottom-nav">

    <a href="index.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="categories.html" class="active">
        <i class="fa-solid fa-layer-group"></i>
        <span>Categories</span>
    </a>

    <a href="library.html">
        <i class="fa-solid fa-bookmark"></i>
        <span>Library</span>
    </a>

    <a href="about.html">
        <i class="fa-solid fa-circle-info"></i>
        <span>About</span>
    </a>

</nav>


<!-- SCRIPTS -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="database.js"></script>

</body>
</html>
