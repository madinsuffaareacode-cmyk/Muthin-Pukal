
<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Song | ಮುತ್ತിൻ ಪുകൾ</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;500;600;700&family=Amiri:wght@400;700&family=Noto+Sans+Kannada:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Anek Malayalam', sans-serif;
            background: #061f18;
            color: #eee;
            padding-bottom: 90px;
        }

        .song-page {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .song-box {
            background: #10382c;
            border: 1px solid rgba(214,181,104,0.4);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            color: #e4c477;
            margin-bottom: 22px;
            font-size: 16px;
        }

        #songTitle {
            color: #e4c477;
            font-size: clamp(25px, 5vw, 36px);
            text-align: center;
            margin-bottom: 10px;
        }

        #songCategory {
            text-align: center;
            color: #b8c8bd;
            margin-bottom: 25px;
        }

        .lyrics-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 25px 0;
        }

        .lyrics-tabs button {
            background: #08271d;
            color: #e4c477;
            border: 1px solid #c5a45d;
            border-radius: 25px;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
        }

        .lyrics-tabs button.active {
            background: #d6b568;
            color: #08271d;
        }

        .lyrics-content {
            font-size: 20px;
            line-height: 2.2;
            padding: 20px 5px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .lyrics-content.malayalam {
            font-family: 'Anek Malayalam', sans-serif;
        }

        .lyrics-content.kannada {
            font-family: 'Noto Sans Kannada', sans-serif;
        }

        .lyrics-content.arabic {
            font-family: 'Amiri', serif;
            font-size: 27px;
            direction: rtl;
            text-align: right;
        }

        .lyrics-content.urdu {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 24px;
            direction: rtl;
            text-align: right;
        }

        .mp-copy-lyrics,
        .mp-download-pdf {
            background: linear-gradient(135deg, #14533c, #1d7652);
            color: white;
            border: 1px solid #c5a45d;
            padding: 11px 20px;
            margin: 10px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }

        .song-media {
            margin-top: 30px;
        }

        .song-media h3 {
            color: #e4c477;
            margin-bottom: 15px;
        }

        .song-media audio {
            width: 100%;
        }

        .song-media iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border: 0;
            border-radius: 12px;
        }

        #songMessage {
            text-align: center;
            padding: 40px 10px;
            color: #e4c477;
        }

        @media(max-width: 600px) {
            .song-page {
                padding: 14px;
                margin: 20px auto;
            }

            .song-box {
                padding: 18px;
            }

            .lyrics-content {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ಮುತ್ತിൻ ಪുകൾ</div>
    <p>ಇസ്‌ലಾಮിക ಮದ್ಹ് ഗാനങ്ങൾ</p>
    <nav>
        <a href="index.html">Home</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
    </nav>
</header>

<main class="song-page">

    <a href="index.html#songs" class="back-button">
        <i class="fa-solid fa-arrow-left"></i> Back to Songs
    </a>

    <div class="song-box">

        <div id="songMessage">Loading song...</div>

        <div id="songContent" hidden>

            <h1 id="songTitle"></h1>
            <p id="songCategory"></p>

            <div id="lyricsTabs" class="lyrics-tabs"></div>

            <div id="lyricsArea"></div>

            <div id="audioArea" class="song-media"></div>

            <div id="videoArea" class="song-media"></div>

        </div>

    </div>

</main>

<footer>
    <p>© 2026 Muthin Pukal. All Rights Reserved.</p>
    <p>Created by: Ibn Jamaluddin Al Furqani</p>
</footer>

<nav class="mp-bottom-nav" aria-label="Main navigation">
    <a href="index.html" class="mp-nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>
    <a href="categories.html" class="mp-nav-item">
        <i class="fa-solid fa-layer-group"></i>
        <span>Categories</span>
    </a>
    <a href="index.html#songs" class="mp-nav-item active">
        <i class="fa-solid fa-book-open"></i>
        <span>Library</span>
    </a>
    <a href="about.html" class="mp-nav-item">
        <i class="fa-solid fa-circle-info"></i>
        <span>About</span>
    </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const DB_URL = "https://bnvmdtpplavypgzvpaga.supabase.co";
const DB_KEY = "sb_publishable_iX79SzzZ0dW-Kd1VUYthaA_mSfWuYX8";

const db = window.supabase.createClient(DB_URL, DB_KEY);

const songId = new URLSearchParams(window.location.search).get("id");

const message = document.getElementById("songMessage");
const content = document.getElementById("songContent");

function getYouTubeId(url) {
    try {
        const parsed = new URL(url);

        if (parsed.hostname.includes("youtu.be")) {
            return parsed.pathname.slice(1).split("/")[0];
        }

        if (parsed.hostname.includes("youtube.com")) {
            if (parsed.pathname === "/watch") {
                return parsed.searchParams.get("v");
            }

            const parts = parsed.pathname.split("/");

            if (["embed", "shorts", "live"].includes(parts[1])) {
                return parts[2];
            }
        }
    } catch (error) {
        console.error("Invalid YouTube URL:", error);
    }

    return null;
}

async function copyLyrics(text, button) {
    try {
        await navigator.clipboard.writeText(text);
        button.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
    } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();

        const copied = document.execCommand("copy");
        textarea.remove();

        button.textContent = copied ? "Copied!" : "Copy failed";
    }

    setTimeout(() => {
        button.innerHTML = '<i class="fa-solid fa-copy"></i> Copy Lyrics';
    }, 2000);
}

async function loadSong() {
    if (!songId) {
        message.textContent = "Song not found. Please go back and select a song.";
        return;
    }

    try {
        const { data: song, error } = await db
            .from("songs")
            .select("*")
            .eq("id", songId)
            .single();

        if (error || !song) {
            console.error("SONG ERROR:", error);
            message.textContent = "Unable to load this song.";
            return;
        }

        document.title = (song.title || "Song") + " | മുത്തിൻ പുകൾ";

        document.getElementById("songTitle").textContent =
            song.title || "Untitled Song";

        document.getElementById("songCategory").textContent =
            "Category: " + (song.category || "Others");

        const languages = [
            ["malayalam", "മലയാളം", song.lyrics_malayalam],
            ["kannada", "ಕನ್ನಡ", song.lyrics_kannada],
            ["arabic", "العربية", song.lyrics_arabic],
            ["urdu", "اردو", song.lyrics_urdu]
        ];

        const available = languages.filter(
            item => typeof item[2] === "string" && item[2].trim() !== ""
        );

        const tabs = document.getElementById("lyricsTabs");
        const area = document.getElementById("lyricsArea");

        if (available.length > 0) {
            available.forEach((item, index) => {
                const tab = document.createElement("button");
                tab.textContent = item[1];

                if (index === 0) tab.classList.add("active");

                tab.addEventListener("click", () => {
                    showLanguage(index);
                });

                tabs.appendChild(tab);
            });

            function showLanguage(index) {
                tabs.querySelectorAll("button").forEach((button, i) => {
                    button.classList.toggle("active", i === index);
                });

                area.innerHTML = "";

                const copyButton = document.createElement("button");
                copyButton.className = "mp-copy-lyrics";
                copyButton.innerHTML =
                    '<i class="fa-solid fa-copy"></i> Copy Lyrics';

                copyButton.addEventListener("click", () => {
                    copyLyrics(available[index][2], copyButton);
                });

                const lyrics = document.createElement("div");
                lyrics.className = "lyrics-content " + available[index][0];
                lyrics.textContent = available[index][2];

                area.appendChild(copyButton);
                area.appendChild(lyrics);
            }

            showLanguage(0);
        } else {
            area.textContent = "Lyrics are not available for this song yet.";
        }

        // AUDIO
        if (song.audio_url) {
            const audioArea = document.getElementById("audioArea");

            const heading = document.createElement("h3");
            heading.textContent = "Listen to Song";

            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = song.audio_url;

            audioArea.appendChild(heading);
            audioArea.appendChild(audio);
        }

        // YOUTUBE VIDEO
        if (song.youtube_url) {
            const videoId = getYouTubeId(song.youtube_url);

            if (videoId) {
                const videoArea = document.getElementById("videoArea");

                const heading = document.createElement("h3");
                heading.textContent = "Watch Song on YouTube";

                const iframe = document.createElement("iframe");
                iframe.src = "https://www.youtube.com/embed/" + videoId;
                iframe.title = song.title || "Song video";
                iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;
                iframe.loading = "lazy";

                videoArea.appendChild(heading);
                videoArea.appendChild(iframe);
            }
        }

        message.hidden = true;
        content.hidden = false;

    } catch (error) {
        console.error("DATABASE ERROR:", error);
        message.textContent = "Something went wrong while loading the song.";
    }
}

loadSong();
</script>

</body>
</html>
