
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muthin Pukal - Admin</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #edf5ef;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.login-box {
  background: white;
  padding: 30px;
  width: 320px;
  max-width: calc(100% - 60px);
  border-radius: 15px;
  box-shadow: 0 5px 25px #0002;
  text-align: center;
}
h2 { color: #07513b; }
input {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
}
button {
  width: 100%;
  padding: 13px;
  background: #07513b;
  color: white;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  margin-top: 10px;
}
.secondary {
  background: #e6eee8;
  color: #07513b;
}
#message {
  margin-top: 15px;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.hidden { display: none; }
</style>
</head>
<body>

<div class="login-box">
  <h2>✦ Muthin Pukal ✦</h2>

  <div id="loginSection">
    <p>Admin Login</p>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Admin Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <button class="secondary" id="forgotButton" type="button">
      Forgot Password?
    </button>
  </div>

  <div id="resetSection" class="hidden">
    <p>Reset Your Password</p>
    <input type="password" id="newPassword" placeholder="New Password" required>
    <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
    <button id="updateButton" type="button">Update Password</button>
  </div>

  <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bnvmdtpplavypgzvpaga.supabase.co";
const SUPABASE_KEY = "sb_publishable_iX79SzzZ0dW-Kd1VUYthaA_mSfWuYX8";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginSection = document.getElementById("loginSection");
const resetSection = document.getElementById("resetSection");
const message = document.getElementById("message");

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? "green" : "red";
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    loginSection.classList.add("hidden");
    resetSection.classList.remove("hidden");
    showMessage("Enter your new password.", true);
  }
});

// Admin Login
document.getElementById("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  showMessage("Logging in...", true);

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showMessage(error.message);
  } else {
    showMessage("Login successful!", true);
  }
});

// Send password reset email
document.getElementById("forgotButton").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    showMessage("Please enter your admin email first.");
    return;
  }

  showMessage("Sending reset email...", true);

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/admin.html"
  });

  if (error) {
    showMessage(error.message);
  } else {
    showMessage("Password reset email sent. Check your Gmail.", true);
  }
});

// Update password
document.getElementById("updateButton").addEventListener("click", async () => {
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (newPassword.length < 6) {
    showMessage("Password must be at least 6 characters.");
    return;
  }

  if (newPassword !== confirmPassword) {
    showMessage("Passwords do not match.");
    return;
  }

  showMessage("Updating password...", true);

  const { error } = await supabaseClient.auth.updateUser({
    password: newPassword
  });

  if (error) {
    showMessage(error.message);
  } else {
    showMessage("Password updated successfully! You can now login.", true);
    await supabaseClient.auth.signOut();
    resetSection.classList.add("hidden");
    loginSection.classList.remove("hidden");
  }
});
</script>

</body>
</html>
