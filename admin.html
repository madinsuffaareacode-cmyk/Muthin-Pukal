
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muthin Pukal - Admin Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f5f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 35px;
            width: 320px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #0002;
            text-align: center;
        }
        h2 { color: #07513b; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #07513b;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 12px;
        }
        #message { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>✦ Muthin Pukal ✦</h2>
    <p>Admin Login</p>

    <form id="loginForm">
        <input type="email" id="email"
               placeholder="Admin Email" required>

        <input type="password" id="password"
               placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://bnvmdtpplavypgzvpaga.supabase.co";
const SUPABASE_KEY = "sb_publishable_iX79SzzZ0dW-Kd1VUYthaA_mSfWuYX8";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.textContent = "Logging in...";

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        message.textContent = error.message;
        message.style.color = "red";
        return;
    }

    message.textContent = "Login successful! Admin access confirmed.";
    message.style.color = "green";
});
</script>

</body>
</html>
