
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Muthin Pukal</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f7f1;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        h2 { color: #14532d; }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #14532d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .hidden { display: none; }
    </style>
</head>

<body>
    <div class="card">
        <h2>Reset Password</h2>
        <p>Enter your new password below.</p>

        <form id="resetForm">
            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                minlength="6"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

            <button type="submit" id="resetButton">
                Update Password
            </button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        const SUPABASE_URL = "https://bnvmdtpplavypgzvpaga.supabase.co";

        const SUPABASE_KEY = "sb_publishable_iX79SzzZ0dW-Kd1VUYthaA_mSfWuYX8";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const button = document.getElementById("resetButton");

        let recoveryReady = false;

        function showMessage(text, color = "red") {
            message.textContent = text;
            message.style.color = color;
        }

        // Check whether this is a valid password recovery session
        async function initializeRecovery() {
            const params = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(
                window.location.hash.substring(1)
            );

            if (params.get("error") || hashParams.get("error")) {
                const errorDescription =
                    params.get("error_description") ||
                    hashParams.get("error_description") ||
                    "The reset link is invalid or expired.";

                showMessage(decodeURIComponent(
                    errorDescription.replace(/\+/g, " ")
                ));
                form.classList.add("hidden");
                return;
            }

            const { data, error } = await supabaseClient.auth.getSession();

            if (error || !data.session) {
                showMessage(
                    "Reset link is invalid or expired. Please request a new password reset email."
                );
                form.classList.add("hidden");
                return;
            }

            recoveryReady = true;
            showMessage("Enter your new password.", "#14532d");
        }

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === "PASSWORD_RECOVERY" && session) {
                recoveryReady = true;
                showMessage("Enter your new password.", "#14532d");
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!recoveryReady) {
                showMessage("Please open a valid password reset link first.");
                return;
            }

            const password = document.getElementById("newPassword").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                showMessage("Password must be at least 6 characters.");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.");
                return;
            }

            button.disabled = true;
            button.textContent = "Updating...";

            const { error } = await supabaseClient.auth.updateUser({
                password: password
            });

            if (error) {
                showMessage(error.message);
                button.disabled = false;
                button.textContent = "Update Password";
                return;
            }

            showMessage(
                "Password updated successfully! You can now login.",
                "#14532d"
            );

            form.classList.add("hidden");

            await supabaseClient.auth.signOut();
        });

        initializeRecovery();
    </script>
</body>
</html>
